name: pack
on:
  push:
    branches: [main]
permissions:
  contents: write
env:
  V: "0.1.29"
  GH_TOKEN: ${{ github.token }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Inputs
        run: |
          gh release download "inputs-$env:V" --repo $env:GITHUB_REPOSITORY -p "sweep-win-inputs-*.tar.gz" -D in
          tar -xzf (Get-ChildItem in\*.tar.gz)[0].FullName
      - name: Installer (signed one if it is on the release, else compile)
        run: |
          $names = gh release view "inputs-$env:V" --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          New-Item -ItemType Directory -Force dist | Out-Null
          if ($names -contains "Sweep-$env:V-setup.exe") {
            gh release download "inputs-$env:V" --repo $env:GITHUB_REPOSITORY -p "Sweep-$env:V-setup.exe" -D dist
          } else {
            $p = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$p\ISCC.exe")) { choco install innosetup -y --no-progress | Out-Null }
            & "$p\ISCC.exe" /Q /DAppVersion=$env:V windows\installer\Sweep.iss
            if ($LASTEXITCODE) { exit 1 }
            Copy-Item "dist\Sweep-$env:V-setup.exe" "Sweep-$env:V-setup.unsigned.exe"
            gh release upload "inputs-$env:V" --repo $env:GITHUB_REPOSITORY "Sweep-$env:V-setup.unsigned.exe" --clobber
          }
          foreach ($f in @("dist\Sweep-$env:V-setup.exe")) { $s = Get-AuthenticodeSignature $f; "installer signature: $($s.Status) $($s.SignerCertificate.Subject)" }
      - name: End-to-end
        run: windows\e2e.ps1
      - name: Diagnostics
        if: failure()
        run: |
          $d = "$env:ProgramData\AZET Sweep"
          Get-ChildItem $d -Recurse -ErrorAction SilentlyContinue | Select FullName, Length | Format-Table -AutoSize | Out-String -Width 200
          $tok = (Get-Content "$d\ui-token" -ErrorAction SilentlyContinue).Trim()
          if ($tok) { Invoke-RestMethod -Uri http://127.0.0.1:47853/api/state -Headers @{ Authorization = "Bearer $tok"; 'X-Sweep' = '1' } | ConvertTo-Json -Depth 6 }
          Get-ChildItem $d -Recurse -Include *.log, *.txt -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Tail 60 }
          Get-WinEvent -LogName Application -MaxEvents 30 -ErrorAction SilentlyContinue | Where-Object ProviderName -match 'Sweep' | Format-List TimeCreated, Message
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: dist/shots/
          retention-days: 3
