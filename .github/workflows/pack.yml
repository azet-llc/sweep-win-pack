name: pack
on:
  push:
    branches: [main]
permissions:
  contents: write
env:
  V: "0.1.30"
  GH_TOKEN: ${{ github.token }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Inputs
        run: |
          gh release download "inputs-$env:V" --repo $env:GITHUB_REPOSITORY -p "sweep-win-inputs-*.tar.gz" -D in
          tar -xzf (Get-ChildItem in\*.tar.gz)[0].FullName
      - name: Installer (signed one if it is on the release, else compile)
        run: |
          $names = gh release view "inputs-$env:V" --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          New-Item -ItemType Directory -Force dist | Out-Null
          if ($names -contains "Sweep-$env:V-setup.exe") {
            gh release download "inputs-$env:V" --repo $env:GITHUB_REPOSITORY -p "Sweep-$env:V-setup.exe" -D dist
          } else {
            $p = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$p\ISCC.exe")) { choco install innosetup -y --no-progress | Out-Null }
            & "$p\ISCC.exe" /Q /DAppVersion=$env:V windows\installer\Sweep.iss
            if ($LASTEXITCODE) { exit 1 }
            Copy-Item "dist\Sweep-$env:V-setup.exe" "Sweep-$env:V-setup.unsigned.exe"
            gh release upload "inputs-$env:V" --repo $env:GITHUB_REPOSITORY "Sweep-$env:V-setup.unsigned.exe" --clobber
          }
          foreach ($f in @("dist\Sweep-$env:V-setup.exe")) { $s = Get-AuthenticodeSignature $f; "installer signature: $($s.Status) $($s.SignerCertificate.Subject)" }
      - name: End-to-end
        run: windows\e2e.ps1
      - name: Diagnostics
        if: failure()
        run: |
          $d = "$env:ProgramData\AZET Sweep"
          Get-ChildItem $d -Recurse -ErrorAction SilentlyContinue | Select FullName, Length | Format-Table -AutoSize | Out-String -Width 200
          $tok = (Get-Content "$d\ui-token" -ErrorAction SilentlyContinue).Trim()
          if ($tok) { Invoke-RestMethod -Uri http://127.0.0.1:47853/api/state -Headers @{ Authorization = "Bearer $tok"; 'X-Sweep' = '1' } | ConvertTo-Json -Depth 6 }
          Get-ChildItem $d -Recurse -Include *.log, *.txt -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Tail 60 }
          Get-WinEvent -LogName Application -MaxEvents 30 -ErrorAction SilentlyContinue | Where-Object ProviderName -match 'Sweep' | Format-List TimeCreated, Message
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: dist/shots/
          retention-days: 3
  mac:
    runs-on: macos-latest
    env:
      MV: "0.1.28"
    steps:
      - name: Notarized pkg
        run: |
          gh release download "inputs-$V" --repo $GITHUB_REPOSITORY -p "Sweep-$MV.pkg" -D dl
          pkgutil --check-signature dl/Sweep-$MV.pkg | head -4
          spctl -a -vv -t install dl/Sweep-$MV.pkg
      - name: Install, block, uninstall
        run: |
          sudo installer -pkg dl/Sweep-$MV.pkg -target /
          D="/Library/Application Support/AZET Sweep"
          for i in $(seq 60); do [ -f "$D/ui-token" ] && break; sleep 2; done
          sudo launchctl print system/io.azet.sweep.daemon | grep -E "state|pid" | head -3
          T=$(sudo cat "$D/ui-token")
          for i in $(seq 40); do S=$(curl -s -H "Authorization: Bearer $T" -H "X-Sweep: 1" http://127.0.0.1:47853/api/state); echo "$S" | grep -q '"state":"enabling"' || break; sleep 3; done
          echo "$S" | python3 -c 'import json,sys; s=json.load(sys.stdin)["status"]; print("state",s.get("state"),"protected",s.get("protected"),"issues",[i.get("code") for i in s.get("issues") or []])'
          scutil --dns | grep nameserver | sort -u | head
          AD=$(dscacheutil -q host -a name doubleclick.net | awk '/ip_address/{print $2}' | head -1); echo "doubleclick.net -> $AD"
          OK=$(dscacheutil -q host -a name example.com | awk '/ip_address/{print $2}' | head -1); echo "example.com -> $OK"
          codesign -dv /Applications/Sweep.app 2>&1 | grep -E "Authority=Developer ID Application|runtime"
          [ "$AD" = "0.0.0.0" ] && [ -n "$OK" ] && [ "$OK" != "0.0.0.0" ]
          sudo /Applications/Sweep.app/Contents/Resources/uninstall.sh
          sleep 5; ! sudo launchctl print system/io.azet.sweep.daemon >/dev/null 2>&1 && echo "daemon removed"
          scutil --dns | grep nameserver | sort -u | head -3
